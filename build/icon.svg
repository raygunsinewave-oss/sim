<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="0.55" stop-color="#0b0a1a"/>
      <stop offset="1" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d4a"/>
      <stop offset="1" stop-color="#1c1e26"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="0.3" stop-color="#101012"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="label" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5ce1"/>
      <stop offset="1" stop-color="#b0129a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- macOS squircle tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="url(#neon)" stroke-width="10" opacity="0.85" filter="url(#glow)"/>
  <!-- deck body -->
  <g filter="url(#shadow)">
    <rect x="150" y="190" width="724" height="644" rx="56" fill="url(#deck)" stroke="#555a6b" stroke-width="4"/>
  </g>
  <!-- platter ring -->
  <circle cx="440" cy="510" r="245" fill="#0d0e12" stroke="#6b7080" stroke-width="6"/>
  <g stroke="#c9ced8" stroke-width="4" opacity="0.55">
    <!-- strobe dots -->
    <circle cx="440" cy="510" r="238" fill="none" stroke-dasharray="4 14"/>
  </g>
  <!-- vinyl -->
  <circle cx="440" cy="510" r="222" fill="url(#vinyl)"/>
  <g fill="none" stroke="#2c2c33" stroke-width="2">
    <circle cx="440" cy="510" r="205"/><circle cx="440" cy="510" r="190"/>
    <circle cx="440" cy="510" r="175"/><circle cx="440" cy="510" r="160"/>
    <circle cx="440" cy="510" r="145"/><circle cx="440" cy="510" r="130"/>
    <circle cx="440" cy="510" r="115"/><circle cx="440" cy="510" r="100"/>
  </g>
  <!-- vinyl sheen -->
  <path d="M300 370 A200 200 0 0 1 560 330" stroke="#ffffff" stroke-opacity="0.18" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M580 650 A200 200 0 0 1 330 690" stroke="#ffffff" stroke-opacity="0.10" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- label -->
  <circle cx="440" cy="510" r="76" fill="url(#label)"/>
  <text x="440" y="494" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="900" font-size="34" fill="#fff">DJSIM</text>
  <text x="440" y="552" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="17" letter-spacing="3" fill="#ffd6f6">RAYGUN</text>
  <circle cx="440" cy="510" r="9" fill="#d8dbe3"/>
  <!-- neon platter glow ring -->
  <circle cx="440" cy="510" r="252" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
  <!-- tonearm -->
  <circle cx="742" cy="270" r="42" fill="#2a2d38" stroke="#8a8fa0" stroke-width="5"/>
  <circle cx="742" cy="270" r="16" fill="#c9ced8"/>
  <path d="M742 270 L742 430 L612 600" stroke="#d8dbe3" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="580" y="590" width="58" height="34" rx="8" fill="#e8eaf0" transform="rotate(-38 609 607)"/>
  <!-- pitch fader -->
  <rect x="790" y="460" width="22" height="300" rx="10" fill="#0b0c10" stroke="#555a6b" stroke-width="3"/>
  <rect x="772" y="575" width="58" height="34" rx="6" fill="#e8eaf0"/>
  <rect x="772" y="589" width="58" height="6" fill="#ff2bd6"/>
  <!-- start/stop + cue buttons -->
  <rect x="190" y="760" width="90" height="46" rx="10" fill="#1a1c24" stroke="#00f0ff" stroke-width="4" filter="url(#glow)"/>
  <rect x="300" y="760" width="90" height="46" rx="10" fill="#1a1c24" stroke="#ff2bd6" stroke-width="4" filter="url(#glow)"/>
  <!-- knobs -->
  <circle cx="200" cy="240" r="22" fill="#2a2d38" stroke="#8a8fa0" stroke-width="4"/>
  <line x1="200" y1="240" x2="200" y2="222" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="262" cy="240" r="22" fill="#2a2d38" stroke="#8a8fa0" stroke-width="4"/>
  <line x1="262" y1="240" x2="276" y2="228" stroke="#ff2bd6" stroke-width="5" stroke-linecap="round"/>
</svg>
