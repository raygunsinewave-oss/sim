name: Build DJSIM for macOS

on:
  push:
    branches: [main, ci-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Package DJSIM (.dmg + .zip, Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never

      - name: List build output
        run: ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DJSIM-macOS
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "DJSIM by Raygun ${TAG}" --notes-file RELEASE_NOTES.md --latest --target "${GITHUB_SHA}"
          else
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --latest
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
